{% load static %}
<header class="site-header">
    <div class="header-container">
        <a href="{% url 'dashboard' %}" class="logo">
            <img src="{% static 'img/Logo.png' %}" alt="Auth Application" class="logo-img">
        </a>
        <nav class="navigation">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>
                <a href="{% url 'profile' %}">
                    Profile
                </a>
                <a href="{% url 'about' %}">
                    About
                </a>
                <a href="{% url 'logout' %}" class="logout-link">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}">
                    Login
                </a>
                <a href="{% url 'register' %}">
                    Register
                </a>
            {% endif %}
        </nav>
    </div>
</header>
