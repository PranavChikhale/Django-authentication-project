<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>
<body>

    <h1> Login Page</h1>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label> Username: </label>
        <input type="text" name="username" required>

        <br><br>

        <label> Password:- </label>
        <input type="text" name="password" required>

        <br><br>

        <button type="submit"> Login </button>
    </form>

</body>
</html>
